name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Prioridad: secret de repo -> variable de repo
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || vars.NEXT_PUBLIC_API_URL }}

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Set version
        id: version
        run: echo "VERSION=v2.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        run: echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Validate required envs
        run: |
          if [ -z "$NEXT_PUBLIC_API_URL" ]; then
            echo "ERROR: Missing NEXT_PUBLIC_API_URL (define it as secret or repo variable)"
            exit 1
          fi

      - name: Build
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -t ghcr.io/agroplataforma-maiz/agro-frontend:${{ steps.version.outputs.VERSION }} \
            -t ghcr.io/agroplataforma-maiz/agro-frontend:latest \
            .

      - name: Push
        run: |
          docker push ghcr.io/agroplataforma-maiz/agro-frontend:${{ steps.version.outputs.VERSION }}
          docker push ghcr.io/agroplataforma-maiz/agro-frontend:latest